<style>
:root{--bg:#10151d;--panel:#19222e;--panel2:#202c3a;--text:#edf2f7;--muted:#9eacbd;--line:#344354;--accent:#75c9c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:100vh;min-height:540px}aside{background:var(--panel);padding:18px;overflow:auto;border-right:1px solid var(--line)}
h1{font-size:19px;margin:0 0 5px}.sub,.note{color:var(--muted);font-size:12px}.sub{margin-bottom:18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 8px}
.controls{display:flex;gap:7px;flex-wrap:wrap}button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent)}
.chain{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid #2b3745}.chain input{accent-color:var(--accent)}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}.chain label{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1}.chain strong{font-size:13px}
.note{margin-top:14px;line-height:1.55}main{position:relative;min-width:0}#viewport{position:absolute;inset:0}
#status{position:absolute;left:14px;bottom:12px;background:#10151ddd;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:12px;max-width:calc(100% - 28px);pointer-events:none}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,1fr);height:auto;min-height:100vh}aside{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}main{min-height:55vh}}
</style>
</head>
