const stage = new NGL.Stage("viewport", {
  backgroundColor: "black",
  tooltip: false
});

let structureComponent = null;
const reps = {};
const visible = {"A":true,"A_2":true,"A_3":true,"A_4":true};
let spinning = false;

function colorSchemeForChains(){
  return [
    [0x5ca8ff, "A"],
    [0xff6570, "A_2"],
    [0x65d98a, "A_3"],
    [0xffbd5c, "A_4"]
  ];
}

function chainColor(chain){
  const m={A:0x5ca8ff,A_2:0xff6570,A_3:0x65d98a,A_4:0xffbd5c};
  return m[chain] ?? 0xbfc7d5;
}

function addRepresentations(){
  if(!structureComponent) return;

  // True NGL cartoon, so secondary structure is generated by NGL rather than
  // a hand-made ribbon approximation.
  for(const chain of Object.keys(visible)){
    const sel=`:${chain}`;
    reps[chain] = {
      cartoon: structureComponent.addRepresentation("cartoon", {
        sele: sel,
        color: chainColor(chain),
        aspectRatio: 5.0,
        scale: 0.85,
        quality: "high",
        opacity: 1.0
      }),
      atoms: structureComponent.addRepresentation("ball+stick", {
        sele: sel+" and not _H",
        color: "element",
        scale: 0.22,
        aspectRatio: 1.4,
        visible: false
      }),
      surface: structureComponent.addRepresentation("surface", {
        sele: sel,
        color: chainColor(chain),
        opacity: 0.18,
        visible: false,
        useWorker: true
      })
    };
  }
}

function setChain(chain,on){
  visible[chain]=on;
  if(reps[chain]) Object.values(reps[chain]).forEach(r=>r.setVisibility(on));
  document.getElementById("chain"+(chain==="A"?"A":chain.replace("_",""))).classList.toggle("active",on);
}

function setMode(mode){
  for(const chain of Object.keys(reps)){
    reps[chain].cartoon.setVisibility(mode==="cartoon" && visible[chain]);
    reps[chain].atoms.setVisibility(mode==="atoms" && visible[chain]);
    reps[chain].surface.setVisibility(mode==="surface" && visible[chain]);
  }
  document.getElementById("cartoon").classList.toggle("active",mode==="cartoon");
  document.getElementById("atoms").classList.toggle("active",mode==="atoms");
  document.getElementById("surface").classList.toggle("active",mode==="surface");
}

document.getElementById("cartoon").onclick=()=>setMode("cartoon");
document.getElementById("atoms").onclick=()=>setMode("atoms");
document.getElementById("surface").onclick=()=>setMode("surface");

for(const chain of Object.keys(visible)){
  const id="chain"+(chain==="A"?"A":chain.replace("_",""));
  document.getElementById(id).onclick=()=>setChain(chain,!visible[chain]);
}

document.getElementById("reset").onclick=()=>{
  if(structureComponent) structureComponent.autoView(800);
};
document.getElementById("spin").onclick=()=>{
  spinning=!spinning;
  document.getElementById("spin").classList.toggle("active",spinning);
  stage.setSpin([0,1,0], spinning ? 0.01 : 0);
};

stage.signals.clicked.add(function(pickingProxy){
  if(!pickingProxy || !pickingProxy.atom) return;
  const a=pickingProxy.atom;
  const el=document.getElementById("tooltip");
  el.style.display="block";
  el.style.left=(window.innerWidth/2+12)+"px";
  el.style.top=(window.innerHeight/2+12)+"px";
  el.innerHTML="<b>"+a.chainname+":"+a.resno+" "+a.resname+"</b><br>"+
               "Atom "+a.atomname+" · "+a.element+
               "<br>("+a.x.toFixed(2)+", "+a.y.toFixed(2)+", "+a.z.toFixed(2)+")";
  setTimeout(()=>el.style.display="none",2200);
});

stage.signals.hovered.add(function(pickingProxy){
  const el=document.getElementById("tooltip");
  if(!pickingProxy || !pickingProxy.atom){ el.style.display="none"; return; }
  const a=pickingProxy.atom;
  el.style.display="block";
  el.style.left=(stage.mouse.x+14)+"px";
  el.style.top=(stage.mouse.y+14)+"px";
  el.innerHTML="<b>"+a.chainname+":"+a.resno+" "+a.resname+"</b><br>"+
               "Atom "+a.atomname+" · "+a.element;
});

stage.loadFile(new Blob([CIF_DATA],{type:"text/plain"}),{ext:"cif"}).then(function(o){
  structureComponent=o;
  addRepresentations();
  setMode("cartoon");
  o.autoView(800);
  document.getElementById("status").innerHTML =
    "Loaded 6UCL · "+o.structure.atomStore.count.toLocaleString()+" atoms<br>"+
    "Cartoon handled by NGL · A / A_2 / A_3 / A_4";
}).catch(function(err){
  document.getElementById("status").textContent="Could not load 6UCL: "+err;
  console.error(err);
});

window.addEventListener("resize",()=>stage.handleResize(),false);
</script>
