<style>
:root{color-scheme:dark;--line:#26364a;--muted:#91a2b8;--text:#edf3fb;--accent:#70d7c0}*{box-sizing:border-box}
body{margin:0;background:#0b1018;color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:330px 1fr;height:100vh;min-height:540px}
aside{background:linear-gradient(180deg,#121d2a,#0e1722);border-right:1px solid var(--line);padding:24px 20px;overflow:auto}
.kicker{color:var(--accent);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}h1{font-size:23px;line-height:1.2;margin:8px 0;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px;margin-bottom:20px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 22px}button{border:1px solid #34465d;background:#1a293a;color:#eaf2fc;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}button:hover{background:#263a50;border-color:#5a789b}
.section{margin:20px 0 8px;color:#8fa5bd;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.item{display:flex;align-items:center;gap:10px;padding:12px 9px;border:1px solid transparent;border-radius:9px;margin:4px 0;background:rgba(255,255,255,.025)}
.item input{accent-color:var(--accent);width:15px;height:15px;margin:0}.dot{width:9px;height:9px;border-radius:50%;flex:none}.label{flex:1}.label strong{display:block;font-size:13px;font-weight:600}.chains{font-size:10px;color:var(--muted);margin-top:2px}
.note{margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:11px}main{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 42%,#1b2a3c 0%,#0b111a 70%)}#viewport{position:absolute;inset:0}
.status{position:absolute;bottom:16px;left:16px;padding:8px 11px;border-radius:8px;background:rgba(8,14,22,.82);border:1px solid #2a3b50;color:#b6c7d9;font-size:11px}.legend{position:absolute;right:16px;top:16px;padding:10px 12px;background:rgba(8,14,22,.78);border:1px solid #2a3b50;border-radius:9px;color:#aebfd2;font-size:11px}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line);padding:16px}.actions{margin:12px 0}.section{margin-top:14px}.note{display:none}main{min-height:300px}}
</style>
