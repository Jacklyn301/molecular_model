const stage = new NGL.Stage("viewport");
let proteinRep, ligandRep, spinning=false;

function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

stage.loadFile(new Blob([b64ToBytes(CIF_B64)],{type:"chemical/x-mmcif"}),{ext:"cif"}).then(function(comp){

  proteinRep=comp.addRepresentation("cartoon",{
    sele:":A or :B",
    colorScheme:"chainname",
    aspectRatio:5,
    scale:1
  });

  // Two alpha-L-arabinopyranose molecules. Select by residue name
  // so label/auth chain-ID differences cannot hide them.
  ligandRep=comp.addRepresentation("spacefill",{
    sele:"ARA",
    colorScheme:"element",
    scale:0.95,
    opacity:0.95
  });

  comp.autoView();

  stage.signals.clicked.add(function(p){
    if(!p || !p.atom) return;
    const a=p.atom,r=a.residue;
    const ligand=a.resname==="ARA";
    document.getElementById("info").innerHTML=
      "<b>2ARC</b> · "+(ligand?"<b>Arabinopyranose</b>":"<b>AraC</b>")+
      "<br>Chain: <b>"+(r&&r.chainname?r.chainname:"?")+
      "</b> · Residue: "+(r?r.resno:"?")+" · Atom: "+(a.atomname||"");
  });
});

function showAll(){proteinRep.setVisibility(true);ligandRep.setVisibility(true)}
function showAraC(){proteinRep.setVisibility(true);ligandRep.setVisibility(false)}
function showLigand(){proteinRep.setVisibility(false);ligandRep.setVisibility(true)}
function toggleSpin(){spinning=!spinning;stage.setSpin(spinning)}
function resetView(){spinning=false;stage.setSpin(false);stage.autoView(500)}
</script>
