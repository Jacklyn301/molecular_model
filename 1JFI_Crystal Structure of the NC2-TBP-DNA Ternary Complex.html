const stage=new NGL.Stage("stage",{backgroundColor:"#0b1220",cameraType:"perspective"});
const reps={};let spinning=false;
function setStatus(s){document.getElementById("status").textContent=s;}
function addRep(item,comp){
 const sele=":"+item.id;
 const opts={sele,colorScheme:"uniform",colorValue:parseInt(item.color.slice(1),16)};
 reps[item.id]=comp.addRepresentation(item.type==="protein"?"cartoon":"ball+stick",opts);
}
function buildUI(){
 const root=document.getElementById("groups");
 DATA.groups.forEach(g=>{
  const section=document.createElement("section");section.className="group";
  const h=document.createElement("h2");h.textContent=g.title;section.appendChild(h);
  g.items.forEach(item=>{
   const row=document.createElement("div");row.className="item";
   const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;cb.dataset.chain=item.id;
   cb.addEventListener("change",()=>{if(reps[item.id])reps[item.id].setVisibility(cb.checked);});
   const sw=document.createElement("span");sw.className="swatch";sw.style.background=item.color;
   const label=document.createElement("label");label.append(document.createTextNode(item.name));
   const chain=document.createElement("span");chain.className="chain";chain.textContent="("+item.id+")";label.appendChild(chain);
   row.append(cb,sw,label);section.appendChild(row);
  });root.appendChild(section);
 });
}
function toggleAll(v){document.querySelectorAll('input[data-chain]').forEach(cb=>{cb.checked=v;if(reps[cb.dataset.chain])reps[cb.dataset.chain].setVisibility(v);});}
document.getElementById("all").onclick=()=>toggleAll(true);
document.getElementById("none").onclick=()=>toggleAll(false);
document.getElementById("reset").onclick=()=>stage.autoView(700);
document.getElementById("spin").onclick=()=>{spinning=!spinning;stage.setSpin(spinning);document.getElementById("spin").textContent=spinning?"Stop spin":"Spin";};
buildUI();
async function load(){
 try{
  setStatus("Decoding mmCIF…");
  const raw=atob(CIF_B64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const blob=new Blob([bytes],{type:"chemical/x-mmcif"});
  setStatus("Parsing original mmCIF…");
  const comp=await stage.loadFile(blob,{ext:"cif",defaultRepresentation:false});
  setStatus("Building 5 chain representations…");
  DATA.groups.flatMap(g=>g.items).forEach(item=>addRep(item,comp));
  comp.autoView();
  document.getElementById("loading").style.display="none";
  setStatus("Loaded · 3 protein chains + 2 DNA strands");
  window.addEventListener("resize",()=>stage.handleResize(),false);
 }catch(e){
  const detail=(e&&e.stack)?e.stack:(e&&e.message)?e.message:String(e);
  document.getElementById("loading").textContent="Structure loading failed: "+String(detail).slice(0,600);
  setStatus("NGL error · "+String(detail).slice(0,150));console.error(e);
 }
}
load();
</script>
