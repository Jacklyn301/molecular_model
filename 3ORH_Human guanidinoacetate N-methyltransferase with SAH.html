var comp=null,spinning=false;
function info(a){
 if(!a)return "No atom selected";
 return "Chain "+(a.chainname||a.chainid||"?")+" · "+(a.resname||"?")+" "+(a.resno??"?")+" · "+(a.atomname||"?")+" ("+(a.element||"?")+")";
}
function loadReps(){
 comp.removeAllRepresentations();
 comp.addRepresentation("cartoon",{sele:"protein",color:"chainid",aspectRatio:5,scale:1,arrow:true});
 comp.addRepresentation("ball+stick",{sele:"not protein",scale:2});
}
stage.loadFile(new Blob([CIF_DATA],{type:"text/plain"}),{ext:"cif"}).then(function(c){
 comp=c; loadReps(); comp.autoView(); document.getElementById("info").textContent="Hover/click a residue or atom.";
}).catch(function(e){document.getElementById("info").textContent="CIF load error: "+e;});
function cartoon(){if(!comp)return;loadReps();comp.autoView();}
function atoms(){if(!comp)return;comp.removeAllRepresentations();
 comp.addRepresentation("cartoon",{sele:"protein",color:"chainid",opacity:.3,arrow:true});
 comp.addRepresentation("ball+stick",{sele:"protein or not protein",scale:1.5});comp.autoView();}
function surface(){if(!comp)return;comp.removeAllRepresentations();
 comp.addRepresentation("surface",{sele:"protein",color:"chainid",opacity:.82});
 comp.addRepresentation("ball+stick",{sele:"not protein",scale:2});comp.autoView();}
function reset(){if(comp)comp.autoView(800);}
function spin(){spinning=!spinning;stage.setSpin(spinning?[0,1,0]:false);}

stage.signals.clicked.add(function(pp){if(pp&&pp.atom)document.getElementById("info").textContent="📌 "+info(pp.atom);});
window.addEventListener("resize",function(){stage.handleResize();});
