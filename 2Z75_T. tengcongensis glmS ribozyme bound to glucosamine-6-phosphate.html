function b64ToBlob(b64, type){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type});}
const stage=new NGL.Stage("viewport",{backgroundColor:"black"});
let riboRibbon,riboBackbone,riboBases,subRibbon,subBackbone,subBases,glp,spinOn=false;
stage.loadFile(b64ToBlob(b64,"chemical/x-mmcif"),{ext:"cif"}).then(comp=>{
  // Entity 2 / chain B: glmS ribozyme RNA. Keep the ribbon and add explicit bases.
  riboRibbon=comp.addRepresentation("cartoon",{sele:":B",colorScheme:"uniform",colorValue:"#55b8ff",aspectRatio:5,scale:1.0});
  riboBackbone=comp.addRepresentation("licorice",{sele:":B",colorScheme:"element",radius:0.18});
  riboBases=comp.addRepresentation("base",{sele:":B",colorScheme:"element",scale:1.15});
  // Entity 1 / chain A: glmS ribozyme substrate RNA. Keep the ribbon and add explicit bases.
  subRibbon=comp.addRepresentation("cartoon",{sele:":A",colorScheme:"uniform",colorValue:"#f2b84b",aspectRatio:5,scale:1.0});
  subBackbone=comp.addRepresentation("licorice",{sele:":A",colorScheme:"element",radius:0.18});
  subBases=comp.addRepresentation("base",{sele:":A",colorScheme:"element",scale:1.15});
  // GlcN6P ligand: clear space-filling model.
  glp=comp.addRepresentation("spacefill",{sele:"GLP",colorScheme:"element",scale:1.35});
  comp.autoView();
  comp.signals.clicked.add(pick=>{
    if(!pick||!pick.atom)return;
    const a=pick.atom;
    let label="";
    if(a.resname==="GLP") label="GlcN6P";
    else if(a.chainname==="B") label="glmS ribozyme RNA";
    else if(a.chainname==="A") label="glmS ribozyme substrate RNA";
    else label=a.resname||"atom";
    document.getElementById("info").innerHTML=`<b>2Z75</b> · ${label}`;
  });
});
function setVisible(rs,v){(Array.isArray(rs)?rs:[rs]).forEach(r=>{if(r)r.setVisibility(v)})}
function showAll(){setVisible([riboRibbon,riboBackbone,riboBases],true);setVisible([subRibbon,subBackbone,subBases],true);setVisible(glp,true)}
function showRibozyme(){setVisible([riboRibbon,riboBackbone,riboBases],true);setVisible([subRibbon,subBackbone,subBases],false);setVisible(glp,false)}
function showSubstrate(){setVisible([riboRibbon,riboBackbone,riboBases],false);setVisible([subRibbon,subBackbone,subBases],true);setVisible(glp,false)}
function showGlcN6P(){setVisible([riboRibbon,riboBackbone,riboBases],false);setVisible([subRibbon,subBackbone,subBases],false);setVisible(glp,true)}
function resetView(){showAll();stage.autoView()}
function spin(){spinOn=!spinOn;stage.setSpin(spinOn?[0,1,0]:null,0.6)}
