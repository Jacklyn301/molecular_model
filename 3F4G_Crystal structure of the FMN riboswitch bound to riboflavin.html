function toggleSpin(){spinning=!spinning;stage.setSpin(spinning?'y':false);}
stage.loadFile(blob,{ext:'cif'}).then(c=>{
 comp=c;
 // Chains A and B are the two RNA strands of the riboswitch.
 const rna='nucleic';
 // Keep the ribbon, while also showing the nucleotide backbone and individual bases.
 rnaRibbon=comp.addRepresentation('cartoon',{sele:rna,colorScheme:'chainname',aspectRatio:4});
 rnaBackbone=comp.addRepresentation('licorice',{sele:rna,visible:true,scale:0.7});
 rnaBases=comp.addRepresentation('base',{sele:rna,visible:true,scale:1.0});
 // The uploaded structure labels chain M / auth Y as the bound flavin ligand.
 ligandRep=comp.addRepresentation('ball+stick',{sele:'RBF',colorScheme:'element',scale:1.0});
 ligandSpace=comp.addRepresentation('spacefill',{sele:'RBF',colorScheme:'element',scale:0.65});
 comp.autoView();
});
</script>
