  {ext:"cif"}
).then(function(comp){

  // Protein chains E and F: TrpR dimer.
  proteinRep = comp.addRepresentation("cartoon",{
    sele:"protein",
    colorScheme:"chainname",
    aspectRatio:5,
    scale:1
  });

  // DNA: ball-and-stick so the nucleotide bases are explicitly visible.
  // This replaces the ribbon-like cartoon representation.
  dnaRep = comp.addRepresentation("ball+stick",{
    sele:"dna",
    colorScheme:"chainname",
    aspectRatio:1.35,
    scale:0.8
  });

  // Tryptophan ligands are HETATM TRP residues.
  // 'hetero' prevents selection of the TRP amino-acid residues
  // that are part of the TrpR protein itself.
  trpRep = comp.addRepresentation("ball+stick",{
    sele:"hetero and TRP",
    colorScheme:"element",
    scale:1.65,
    aspectRatio:1.25
  });

  trpSpace = comp.addRepresentation("spacefill",{
    sele:"hetero and TRP",
    colorScheme:"element",
    scale:.58,
    opacity:.78
  });

  comp.autoView();

  stage.signals.clicked.add(function(p){
    if(!p || !p.atom) return;
    const a=p.atom, r=a.residue;
    let kind="Structure";
    if(a.resname==="TRP" && r && r.isHetero) kind="<b>Tryptophan</b>";
    else if(r && r.isNucleic) kind="<b>DNA</b>";
    else if(r && r.isProtein) kind="<b>TrpR</b>";

    document.getElementById("info").innerHTML =
      "<b>1TRO</b> · "+kind+
      "<br>Chain: <b>"+(r&&r.chainname?r.chainname:"?")+
      "</b> · Residue: "+(r?r.resno:"?")+" · Atom: "+(a.atomname||"");
  });
});

function setVis(p,d,t){
  proteinRep.setVisibility(p);
  dnaRep.setVisibility(d);
  trpRep.setVisibility(t);
  trpSpace.setVisibility(t);
}
function showAll(){setVis(true,true,true)}
function showTrpR(){setVis(true,false,false)}
function showDNA(){setVis(false,true,false)}
function showTrp(){setVis(false,false,true)}
function toggleSpin(){spinning=!spinning;stage.setSpin(spinning)}
function resetView(){spinning=false;stage.setSpin(false);stage.autoView(500)}
</script>
</body>
</html>
