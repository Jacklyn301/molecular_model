const stage=new NGL.Stage("viewport",{backgroundColor:"black",tooltip:false});
let comp=null, reps={}, visible={};
let spinning=false;

const units={
  1:{sele:":A",   color:0x42A5F5},
  2:{sele:":A_2", color:0xEF5350},
  3:{sele:":A_3", color:0xFFC107},
  4:{sele:":A_4", color:0xAB47BC}
};

function addUnit(n){
  const u=units[n];
  reps[n]=comp.addRepresentation("cartoon",{
    sele:u.sele,
    colorScheme:"uniform",
    colorValue:u.color,
    aspectRatio:5,
    scale:1
  });
  visible[n]=true;
}

function build(){
  Object.keys(reps).forEach(k=>reps[k]&&reps[k].dispose());
  reps={}; visible={};
  [1,2,3,4].forEach(addUnit);
}

function toggleUnit(n){
  if(!reps[n])return;
  visible[n]=!visible[n];
  reps[n].setVisibility(visible[n]);
  document.getElementById("info").textContent=
    "Subunit "+n+" · "+units[n].sele+(visible[n]?" shown":" hidden");
}

function showAll(){
  [1,2,3,4].forEach(n=>{
    visible[n]=true; reps[n].setVisibility(true);
  });
  document.getElementById("info").textContent="Tetramer · all four subunits shown.";
}

function hideAll(){
  [1,2,3,4].forEach(n=>{
    visible[n]=false; reps[n].setVisibility(false);
  });
  document.getElementById("info").textContent="Protein subunits hidden.";
}

function resetView(){
  if(comp)comp.autoView(800);
}

function toggleSpin(){
  spinning=!spinning;
  stage.setSpin(spinning?[0,1,0]:false);
}

stage.loadFile(
  new Blob([CIF_DATA],{type:"text/plain"}),
  {ext:"cif"}
).then(function(c){
  comp=c;
  build();
  comp.autoView();
  document.getElementById("info").textContent=
    "Tetramer loaded · hover/click a residue.";
}).catch(function(e){
  document.getElementById("info").textContent="CIF load error: "+e;
});

stage.signals.hovered.add(function(pp){
  if(pp&&pp.atom){
    const a=pp.atom;
    document.getElementById("info").textContent=
      "Chain "+(a.chainname||a.chainid||"?")+" · "+
      (a.resname||"?")+" "+(a.resno??"?")+" · "+
      (a.atomname||"?");
  }
});

stage.signals.clicked.add(function(pp){
  if(pp&&pp.atom){
    const a=pp.atom;
    document.getElementById("info").textContent=
      "📌 Chain "+(a.chainname||a.chainid||"?")+" · "+
      (a.resname||"?")+" "+(a.resno??"?");
  }
});

window.addEventListener("resize",()=>stage.handleResize());
</script>
