  const e=parseInt(document.getElementById("r"+n+"e").value);
  if(!Number.isFinite(s)||!Number.isFinite(e)||s>e) return null;
  return {s,e,sele:":A and "+s+"-"+e};
}
function clearReps(){
  Object.values(reps).forEach(r=>r&&r.dispose());
  reps={};
}
function showBase(){
  clearReps();
  reps.base=comp.addRepresentation("cartoon",{sele:":A",colorScheme:"uniform",colorValue:0x888888,opacity:0.12,aspectRatio:5,scale:1});
  document.getElementById("info").textContent="σ70 base structure · chain A";
}
function pick(n){
  if(!comp)return;
  const q=range(n); if(!q)return;
  if(reps[n])reps[n].dispose();
  reps[n]=comp.addRepresentation("cartoon",{
    sele:q.sele,
    colorScheme:"uniform",
    colorValue:colors[n],
    aspectRatio:5,
    scale:1
  });
  document.getElementById("info").textContent="Region "+n+" · sequence ID "+q.s+"–"+q.e;
}
function applyAll(){
  if(!comp)return;
  clearReps();
  for(const k of [1,2,3,4]){
    const q=range(k);
    if(q){
      reps[k]=comp.addRepresentation("cartoon",{
        sele:q.sele,
        colorScheme:"uniform",
        colorValue:colors[k],
        aspectRatio:5,
        scale:1.0
      });
    }
  }
  document.getElementById("info").textContent="Four sequence regions applied.";
  comp.autoView(600);
}
function resetView(){if(comp)comp.autoView(700)}
let spinning=false;
function toggleSpin(){
  spinning=!spinning;
  stage.setSpin(spinning?[0,1,0]:false);
}
stage.loadFile(new Blob([CIF_DATA],{type:"text/plain"}),{ext:"cif"}).then(function(c){
  comp=c; showBase(); comp.autoView();
  document.getElementById("info").textContent="Loaded · chain A · sequence IDs can be colored by range.";
}).catch(function(e){document.getElementById("info").textContent="CIF load error: "+e});
stage.signals.hovered.add(function(pp){
  if(pp&&pp.atom){
    const a=pp.atom;
    document.getElementById("info").textContent=
      "Chain "+(a.chainname||a.chainid||"?")+" · "+(a.resname||"?")+" "+(a.resno??"?")+" · "+(a.atomname||"?");
  }
});
stage.signals.clicked.add(function(pp){
  if(pp&&pp.atom){
    const a=pp.atom;
    document.getElementById("info").textContent="📌 Chain "+(a.chainname||a.chainid||"?")+" · "+(a.resname||"?")+" "+(a.resno??"?");
  }
});
window.addEventListener("resize",()=>stage.handleResize());
</script>
