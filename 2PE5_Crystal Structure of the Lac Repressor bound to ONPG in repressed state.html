const DNA_SEL=':D or :E';
function b64ToBytes(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
const stage=new NGL.Stage("viewport");
let proteinRep,dnaRep,dnaBaseRep,onpgRep,onpgSpace;
let spinning=false;

stage.loadFile(new Blob([b64ToBytes(CIF_B64)],{type:"chemical/x-mmcif"}),{ext:"cif"}).then(function(comp){
  proteinRep=comp.addRepresentation("cartoon",{sele:"protein",colorScheme:"chainname",aspectRatio:5,scale:1});
  dnaRep=comp.addRepresentation("cartoon",{sele:"nucleic",colorScheme:"chainname",aspectRatio:4,scale:1.1});
  dnaBaseRep=comp.addRepresentation("base",{sele:"nucleic",colorScheme:"chainname",scale:1.2});
  onpgRep=comp.addRepresentation("ball+stick",{sele:"145",colorScheme:"element",scale:2.0,aspectRatio:1.4});
  onpgSpace=comp.addRepresentation("spacefill",{sele:"145",colorScheme:"element",scale:.55,opacity:.72});
  comp.autoView();

  stage.signals.clicked.add(function(p) {
    if(!p||!p.atom)return;
    const a=p.atom,r=a.residue;
    document.getElementById("info").innerHTML=
      "<b>2PE5</b> · "+(a.resname==="145"?"<b>ONPG (145)</b>":(a.residue&&a.residue.isNucleic?"<b>DNA</b>":"Lac repressor"))+
      "<br>Atom: "+(a.atomname||"")+" · Residue: "+(r?r.resno:"")+" · Chain: "+(r&&r.chainname?r.chainname:"");
  });
});

function vis(p,d,o){if(proteinRep)proteinRep.setVisibility(p);if(dnaRep)dnaRep.setVisibility(d);if(dnaBaseRep)dnaBaseRep.setVisibility(d);if(onpgRep)onpgRep.setVisibility(o);if(onpgSpace)onpgSpace.setVisibility(o)}
function showProtein(){vis(true,false,false)}
function showDNA(){vis(false,true,false)}
function showONPG(){vis(false,false,true)}
function showBoth(){vis(true,true,true)}
function toggleSpin(){spinning=!spinning;stage.setSpin(spinning)}
function resetView(){stage.setSpin(false);spinning=false;stage.autoView(500)}
</script>
