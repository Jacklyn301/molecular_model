const cif = atob(CIF_B64);
const stage = new NGL.Stage("viewport", { backgroundColor:"#10151d", tooltip:true });
let component = null, spinning = false;
const reps = {};
function setVisible(chain, visible) {
  if (reps[chain]) reps[chain].setVisibility(visible);
}
document.querySelectorAll("[data-chain]").forEach(el => {
  el.addEventListener("change", () => setVisible(el.dataset.chain, el.checked));
});
document.getElementById("all").onclick = () => {
  document.querySelectorAll("[data-chain]").forEach(el => { el.checked=true; setVisible(el.dataset.chain,true); });
};
document.getElementById("none").onclick = () => {
  document.querySelectorAll("[data-chain]").forEach(el => { el.checked=false; setVisible(el.dataset.chain,false); });
};
document.getElementById("reset").onclick = () => { if(component) stage.autoView(); };
document.getElementById("spin").onclick = () => {
  spinning=!spinning; stage.setSpin(spinning); document.getElementById("spin").textContent=spinning?"Stop spin":"Spin";
};
window.addEventListener("resize", () => stage.handleResize());
(async () => {
  try {
    const blob = new Blob([cif], {type:"text/plain"});
    component = await stage.loadFile(blob, {ext:"cif", defaultRepresentation:false});
    reps.A = component.addRepresentation("cartoon", {sele:":A", colorScheme:"uniform", colorValue:0x63a6e8, quality:"medium"});
    reps.F = component.addRepresentation("ball+stick", {sele:":F", colorScheme:"uniform", colorValue:0xe6b85c, quality:"high"});
    reps.E = component.addRepresentation("spacefill", {sele:":E", colorScheme:"uniform", colorValue:0xef6b73, scale:1.0});
    stage.autoView();
    document.getElementById("status").textContent = "Loaded. Displaying chains A, F and E; solvent and unrelated small molecules are hidden.";
  } catch(err) {
    console.error(err);
    document.getElementById("status").textContent = "Could not load structure: " + (err && err.message ? err.message : String(err));
  }
})();
</script>
