for(const g of groups){
 const label=document.createElement("label");label.className="group";
 label.innerHTML=`<input type="checkbox" data-group="${g.id}" checked><span class="dot" style="background:${g.color}"></span><span><div class="gname">${g.label}</div><div class="chains">Chain ${g.chains.join(", ")}</div></span>`;
 const cb=label.querySelector("input");cb.addEventListener("change",()=>setGroup(g.id,cb.checked));document.getElementById("controls").appendChild(label);
}
function setGroup(id,visible){(reprs[id]||[]).forEach(r=>r.setVisibility(visible));const cb=document.querySelector(`[data-group="${id}"]`);if(cb)cb.checked=visible}
function setAll(visible){groups.forEach(g=>setGroup(g.id,visible))}
async function loadStructure(){
 try{
  stage=new NGL.Stage("stage",{backgroundColor:"#101318",cameraType:"perspective"});
  window.addEventListener("resize",()=>stage.handleResize());
  const raw=atob(cifGzipBase64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const cifBlob=await new Response(stream).blob();
  const comp=await stage.loadFile(cifBlob,{ext:"cif",defaultRepresentation:false});
  for(const g of groups){
   reprs[g.id]=[];
   const p={sele:":"+g.chains[0],color:g.color,opacity:1};
   if(g.repr==="cartoon")reprs[g.id].push(comp.addRepresentation("cartoon",{...p,aspectRatio:4.0}));
   else reprs[g.id].push(comp.addRepresentation("ball+stick",{...p,multipleBond:true}));
  }
  stage.autoView();document.getElementById("status").textContent="9F67 loaded · 4 chains · 7,938 atoms";
 }catch(err){console.error(err);document.getElementById("status").textContent="Could not load structure: "+err.message}
}
document.getElementById("showAll").onclick=()=>setAll(true);
document.getElementById("hideAll").onclick=()=>setAll(false);
document.getElementById("reset").onclick=()=>stage&&stage.autoView();
document.getElementById("spin").onclick=e=>{if(!stage)return;spinning=!spinning;stage.setSpin(spinning);e.currentTarget.textContent=spinning?"Stop spin":"Start spin"};
loadStructure();
</script>
