<style>
:root { color-scheme: dark; --bg:#101318; --panel:#191e26; --muted:#9ba6b5; --line:#2b3441; --text:#edf1f7; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
#app { display:grid; grid-template-columns:315px 1fr; width:100%; height:100%; }
aside { background:var(--panel); border-right:1px solid var(--line); padding:22px 18px; overflow-y:auto; }
h1 { font-size:19px; line-height:1.25; margin:0 0 7px; letter-spacing:-.3px; }
.sub { color:var(--muted); font-size:12px; margin-bottom:22px; }
.eyebrow { color:#8e9aaa; font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; margin:20px 0 10px; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
button { background:#252d38; color:#e9eef6; border:1px solid #394555; border-radius:9px; padding:9px 10px; font-size:12px; cursor:pointer; }
button:hover { background:#303b49; }
.group { display:flex; align-items:flex-start; gap:10px; padding:11px 8px; border-bottom:1px solid rgba(255,255,255,.055); cursor:pointer; border-radius:7px; }
.group:hover { background:rgba(255,255,255,.035); }
.group input { margin:3px 0 0; accent-color:#8aa8d8; }
.dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; margin-top:4px; }
.gname { font-size:13px; line-height:1.3; }
.chains { color:var(--muted); font-size:11px; margin-top:3px; }
.hint { color:var(--muted); font-size:11px; line-height:1.5; margin-top:18px; }
#viewport { position:relative; min-width:0; min-height:0; }
#stage { position:absolute; inset:0; }
#status { position:absolute; left:16px; bottom:14px; padding:7px 10px; border-radius:8px; background:rgba(18,22,29,.82); border:1px solid rgba(255,255,255,.1); color:#c5ced9; font-size:11px; pointer-events:none; }
@media(max-width:700px) {
 #app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
 aside { max-height:44vh; border-right:0; border-bottom:1px solid var(--line); padding:15px; }
 .sub { margin-bottom:10px; } .eyebrow { margin-top:13px; }
 #viewport { min-height:0; }
}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>RAR-beta – RXR-alpha Heterodimer</h1>
  <div class="sub">PDB 5UAN · NGL molecular viewer</div>
  <div class="actions">
    <button id="showAll">Show all</button><button id="hideAll">Hide all</button>
    <button id="reset">Reset view</button><button id="spin">Start spin</button>
  </div>
  <div class="eyebrow">Molecular components</div>
  <div id="controls"></div>
  <div class="hint">Toggle each component independently. Matching chain copies are grouped where indicated. Drag to rotate, scroll to zoom, and right-drag to pan.</div>
</aside>
<main id="viewport"><div id="stage"></div><div id="status">Loading 5UAN…</div></main>

const groups = [{"id": "rxra", "label": "RXR-alpha", "chains": ["A"], "color": "#f0a34a", "repr": "cartoon"}, {"id": "rarb", "label": "RAR-beta", "chains": ["B"], "color": "#59b7e8", "repr": "cartoon"}, {"id": "ncoa2", "label": "Nuclear receptor coactivator 2", "chains": ["C", "D"], "color": "#b48be8", "repr": "cartoon"}, {"id": "dna", "label": "DNA", "chains": ["E", "F"], "color": "#72c99a", "repr": "ball+stick"}, {"id": "trans", "label": "trans-retinoic acid (chain L)", "chains": ["L"], "color": "#f1d45b", "repr": "ball+stick"}, {"id": "cis", "label": "cis-retinoic acid (chain I)", "chains": ["I"], "color": "#ef7e9c", "repr": "ball+stick"}, {"id": "zn", "label": "Zinc ions", "chains": ["G", "H", "J", "K"], "color": "#c5cbd3", "repr": "spacefill"}];
const controls = document.getElementById('controls');
const statusEl = document.getElementById('status');
const reprs = {};
let stage, spinning = false;

function setGroup(id, visible) {
  (reprs[id] || []).forEach(r => r.setVisibility(visible));
  const cb = document.querySelector(`[data-group="${id}"]`);
  if (cb) cb.checked = visible;
}
function setAll(visible) { groups.forEach(g => setGroup(g.id, visible)); }

groups.forEach(g => {
  const label = document.createElement('label');
  label.className = 'group';
  label.innerHTML = `<input type="checkbox" data-group="${g.id}" checked>
    <span class="dot" style="background:${g.color}"></span>
    <span><div class="gname">${g.label}</div><div class="chains">Chain ${g.chains.join(', ')}</div></span>`;
  const cb = label.querySelector('input');
  cb.addEventListener('change', () => setGroup(g.id, cb.checked));
  controls.appendChild(label);
});

async function loadStructure() {
  try {
    stage = new NGL.Stage('stage', { backgroundColor: '#101318', cameraType: 'perspective' });
    window.addEventListener('resize', () => stage.handleResize());
    const raw = atob(cifGzipBase64);
    const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const cifBlob = await new Response(stream).blob();
    const comp = await stage.loadFile(cifBlob, { ext:'cif', defaultRepresentation:false });

    for (const g of groups) {
      reprs[g.id] = [];
      for (const chain of g.chains) {
        const selection = ':' + chain;
        const params = { sele:selection, color:g.color, opacity:1 };
        if (g.repr === 'cartoon') {
          reprs[g.id].push(comp.addRepresentation('cartoon', {...params, aspectRatio:4.0}));
        } else if (g.repr === 'ball+stick') {
          reprs[g.id].push(comp.addRepresentation('ball+stick', {...params, multipleBond:true}));
        } else {
          reprs[g.id].push(comp.addRepresentation('spacefill', {...params, radius:0.9}));
        }
      }
    }
    stage.autoView();
    statusEl.textContent = '5UAN loaded · 12 chains · 5,560 atoms';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Could not load structure: ' + err.message;
  }
}
document.getElementById('showAll').onclick = () => setAll(true);
document.getElementById('hideAll').onclick = () => setAll(false);
document.getElementById('reset').onclick = () => stage && stage.autoView();
document.getElementById('spin').onclick = e => {
  if (!stage) return;
  spinning = !spinning;
  stage.setSpin(spinning);
  e.currentTarget.textContent = spinning ? 'Stop spin' : 'Start spin';
};
loadStructure();
</script>
