const stage = new NGL.Stage("viewport");

const chainColors = {
  A: "#ff1bb8",  // SpA
  B: "#ff1bb8",  // SpA
  C: "#ff1bb8",  // SpA
  D: "#6afa3f",  // Fc
  E: "#6afa3f",  // Fc
  F: "#6afa3f"   // Fc
};

let reps = {};
let spinning = false;

function b64ToBytes(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

stage.loadFile(
  new Blob([b64ToBytes(CIF_B64)],{type:"chemical/x-mmcif"}),
  {ext:"cif"}
).then(function(comp){

  Object.entries(chainColors).forEach(([chain,color])=>{
    reps[chain] = comp.addRepresentation("cartoon", {
      sele: ":" + chain,
      color: color,
      aspectRatio: 5,
      scale: 1
    });
  });

  comp.autoView();

  stage.signals.clicked.add(function(p){
    if(!p || !p.atom) return;
    const a=p.atom, r=a.residue;
    const chain = r && r.chainname ? r.chainname : "?";
    const group = ["A","B","C"].includes(chain) ? "SpA" : "IgG Fc";
    document.getElementById("info").innerHTML =
      "<b>4WWI</b> · <b>"+group+"</b>" +
      "<br>Chain: <b>"+chain+"</b> · Residue: "+
      (r?r.resno:"?")+" · Atom: "+(a.atomname||"");
  });
});

function showAll(){
  Object.values(reps).forEach(r=>r.setVisibility(true));
}

function showSpA(){
  Object.entries(reps).forEach(([chain,r])=>{
    r.setVisibility(["A","B","C"].includes(chain));
  });
}

function showFc(){
  Object.entries(reps).forEach(([chain,r])=>{
    r.setVisibility(["D","E","F"].includes(chain));
  });
}

function resetView(){
  stage.setSpin(false);
  spinning=false;
  Object.values(reps).forEach(r=>r.setVisibility(true));
  stage.autoView(500);
}

function toggleSpin(){
  spinning=!spinning;
  stage.setSpin(spinning);
}
