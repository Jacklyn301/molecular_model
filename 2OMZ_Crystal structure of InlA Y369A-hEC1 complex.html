<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#191f2a;--line:#303949;--text:#e8edf5;--muted:#aab5c5;--accent:#9ec7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:13px 17px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 3px}header p{font-size:12px;color:var(--muted);margin:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 250px;height:calc(100vh - 62px);min-height:450px;overflow:hidden}
#viewport{position:relative;min-width:0;min-height:0;background:#0b0e13;overflow:hidden;isolation:isolate;z-index:0}#stage{position:absolute;inset:0;width:100%;height:100%;z-index:0}
aside{position:relative;z-index:2;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-left:1px solid var(--line);padding:13px}
h2{font-size:13px;color:var(--accent);margin:13px 0 7px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit;font-size:12px;color:var(--text);background:#252f3e;border:1px solid #3a4658;border-radius:7px;padding:8px 7px;text-align:left;cursor:pointer}
button:hover{border-color:var(--accent)}button.active{background:#35475e;border-color:#8db8ee}button.wide{grid-column:1/-1;text-align:center}
.note{font-size:11px;color:var(--muted);margin-top:13px}
@media(max-width:700px){main{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 62px);overflow:visible}#viewport{height:52vh;min-height:330px;flex:none}aside{overflow:visible;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

const stage=new NGL.Stage("stage",{backgroundColor:"#0b0e13"});
window.addEventListener("resize",()=>stage.handleResize());requestAnimationFrame(()=>stage.handleResize());
function makeButton(s){const b=document.createElement("button");b.textContent=s.label;b.className="active";b.style.borderLeft="4px solid "+s.color;s.visible=true;

const bytes=Uint8Array.from(atob(PDB_B64),c=>c.charCodeAt(0));
stage.loadFile(new Blob([bytes],{type:"text/plain"}),{ext:"pdb"}).then(comp=>{
specs.forEach(s=>{s.reps=[comp.addRepresentation("cartoon",{sele:":"+s.chain,colorScheme:"uniform",colorValue:parseInt(s.color.slice(1),16),quality:"high"})];makeButton(s);});

let spinning=false;const spinBtn=document.getElementById("spinBtn");spinBtn.onclick=()=>{spinning=!spinning;stage.setSpin(spinning);spinBtn.textContent=spinning?"Stop spin":"Spin"};
