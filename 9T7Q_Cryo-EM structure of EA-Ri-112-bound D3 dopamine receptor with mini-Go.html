const bytes=Uint8Array.from(pdb,c=>c.charCodeAt(0));
const blob=new Blob([bytes],{type:"text/plain"});

stage.loadFile(blob,{ext:"pdb"}).then(function(c){
  comp=c;
  reps.beta=comp.addRepresentation("cartoon",{sele:":A",colorValue:0x4da6ff,aspectRatio:5,scale:1.05});
  reps.gamma=comp.addRepresentation("cartoon",{sele:":B",colorValue:0xffb347,aspectRatio:5,scale:1.05});
  reps.d3=comp.addRepresentation("cartoon",{sele:":C",colorValue:0x66d9a8,aspectRatio:5,scale:1.05});
  reps.alpha=comp.addRepresentation("cartoon",{sele:":D",colorValue:0xc78cff,aspectRatio:5,scale:1.05});
  reps.scfv=comp.addRepresentation("cartoon",{sele:":E",colorValue:0xf06cae,aspectRatio:5,scale:1.05});
  reps.ligand=comp.addRepresentation("spacefill",{sele:":F",colorValue:0xffe66d,scale:1.35});
  show("all");
  document.getElementById("status").innerHTML=
    "<b>Loaded</b><br>A β1 · B γ2 · C D3 receptor · D α · E scFv16 · F EA-Ri-112";
}).catch(function(err){
  document.getElementById("status").textContent="NGL error: "+String(err);
  console.error(err);
});
function setVis(keys){
  Object.keys(reps).forEach(k=>reps[k].setVisibility(keys.includes(k)));
  comp.autoView(500);
}
function show(mode){
  if(!comp)return;
  if(mode==="all") setVis(["beta","gamma","d3","alpha","scfv","ligand"]);
  else if(mode==="gprotein") setVis(["beta","gamma","alpha"]);
  else if(mode==="D3R") setVis(["d3"]);
  else if(mode==="scFv") setVis(["scfv"]);
  else if(mode==="ligand") setVis(["ligand"]);
}
function resetView(){ if(comp){show("all");comp.autoView(700)} }
function toggleSpin(){spinning=!spinning;stage.setSpin(spinning)}
window.addEventListener("resize",()=>stage.handleResize());
</script>
