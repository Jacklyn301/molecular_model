async function loadStructure(){
 try{
  stage=new NGL.Stage("stage",{backgroundColor:"#101318",cameraType:"perspective"});
  window.addEventListener("resize",()=>stage.handleResize());
  const raw=atob(cifGzipBase64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const cifBlob=await new Response(stream).blob();
  const comp=await stage.loadFile(cifBlob,{ext:"cif",defaultRepresentation:false});
  for(const g of groups){
   reprs[g.id]=[];
   for(const chain of g.chains)reprs[g.id].push(comp.addRepresentation("cartoon",{sele:":"+chain,color:g.color,opacity:1,aspectRatio:4.0}));
  }
  stage.autoView();document.getElementById("status").textContent="4Z2M loaded · 5 chains · 4,594 atoms";
 }catch(err){console.error(err);document.getElementById("status").textContent="Could not load structure: "+err.message}
}
document.getElementById("showAll").onclick=()=>setAll(true);
document.getElementById("hideAll").onclick=()=>setAll(false);
document.getElementById("reset").onclick=()=>stage&&stage.autoView();
document.getElementById("spin").onclick=e=>{if(!stage)return;spinning=!spinning;stage.setSpin(spinning);e.currentTarget.textContent=spinning?"Stop spin":"Start spin"};
loadStructure();
</script>
</body>
