function decode(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
const stage=new NGL.Stage("viewport",{backgroundColor:"black"});
let comp,rv,rs,rn,spinning=false;
stage.loadFile(new Blob([decode(b64)],{type:"text/plain"}),{ext:"pdb"}).then(function(c){
 comp=c;
 rv=comp.addRepresentation("cartoon",{sele:":A",colorValue:0x4da6ff,aspectRatio:5,scale:1.0});
 rs=comp.addRepresentation("cartoon",{sele:":B",colorValue:0xffb347,aspectRatio:5,scale:1.0});
 rn=comp.addRepresentation("cartoon",{sele:":C or :D",colorValue:0xff66cc,aspectRatio:5,scale:1.0});
 show('all');
}).catch(function(e){document.title="ERROR";console.error(e);alert("NGL load error: "+e);});
function show(x){if(!comp)return;rv.setVisibility(x==='all'||x==='vamp');rs.setVisibility(x==='all'||x==='stx');rn.setVisibility(x==='all'||x==='snap');stage.autoView(500);}
function resetView(){if(!comp)return;show('all');stage.autoView(700);}
function spin(){spinning=!spinning;stage.setSpin(spinning);}
window.addEventListener('resize',()=>stage.handleResize());stage.handleResize();
